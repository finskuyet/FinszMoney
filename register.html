<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - LexFinszMoney</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200/60 p-8 space-y-8 my-8">
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-2xl font-bold mx-auto mb-4 shadow-lg shadow-blue-500/30">
                F
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Buat Akun Baru</h1>
            <p class="text-sm text-slate-500">Mulai kelola keuangan Anda hari ini</p>
        </div>

        <!-- Form -->
        <form id="register-form" class="space-y-4">
            <div id="error-message" class="hidden p-3 bg-red-50 text-red-600 text-sm font-semibold rounded-xl border border-red-100 text-center"></div>

            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Nama Lengkap</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-400">person</span>
                    <input type="text" id="name" required placeholder="John Doe" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm transition-all">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-400">mail</span>
                    <input type="email" id="email" required placeholder="nama@email.com" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm transition-all">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-400">lock</span>
                    <input type="password" id="password" required placeholder="••••••••" minlength="6" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm transition-all">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Konfirmasi Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-400">lock_reset</span>
                    <input type="password" id="confirm-password" required placeholder="••••••••" minlength="6" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm transition-all">
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold text-sm rounded-xl shadow-lg shadow-blue-500/25 transition-all mt-2">
                Daftar Akun
            </button>
        </form>

        <!-- Footer -->
        <div class="text-center text-sm text-slate-500">
            Sudah punya akun? <a href="login.html" class="text-blue-600 font-semibold hover:underline">Masuk di sini</a>
        </div>
    </div>

    <!-- Script -->
    <script type="module" src="js/supabaseSync.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Middleware: Redirect jika sudah login
        Auth.requireGuest();

        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorDiv = document.getElementById('error-message');
            
            const btn = this.querySelector('button[type="submit"]');
            btn.textContent = 'Memuat...';

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Konfirmasi password tidak cocok!';
                errorDiv.classList.remove('hidden');
                btn.textContent = 'Daftar Akun';
                return;
            }

            const result = await Auth.register(name, email, password);

            if (result.success) {
                window.location.href = 'login.html';
            } else {
                errorDiv.textContent = result.message;
                errorDiv.classList.remove('hidden');
                btn.textContent = 'Daftar Akun';
            }
        });
    </script>
</body>
</html>
